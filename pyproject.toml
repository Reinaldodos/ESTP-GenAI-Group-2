[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "estp-rag"
version = "0.1.0"
description = "Pipeline RAG modulaire pour les documents de voyage"
requires-python = ">=3.10"
dependencies = [
    "faiss-cpu",
    "numpy",
    "openai",
    "PyYAML",
    "sentence-transformers",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.40",
]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "streamlit>=1.40",
]

[tool.setuptools.packages.find]
include = ["rag_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --cov=rag_pipeline --cov=run_rag --cov-report=term-missing"
