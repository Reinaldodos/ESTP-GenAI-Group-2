[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "estp-rag"
version = "0.1.0"
description = "Pipeline RAG modulaire pour les documents de voyage"
requires-python = ">=3.10"
dependencies = [
    "faiss-cpu",
    "numpy",
    "openai",
    "PyYAML",
    "sentence-transformers",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.40",
]
test = [
    "pre-commit==4.6.2",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff==0.17.0",
    "streamlit>=1.40",
]

[tool.setuptools.packages.find]
include = ["rag_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --cov=rag_pipeline --cov=app --cov=run_rag --cov-branch --cov-report=term-missing --cov-report=html --cov-report=xml"

[tool.ruff]
required-version = "==0.17.0"
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "PIE",
    "PT",
    "S",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"rag_test.ipynb" = ["B018", "E402", "S101", "S105", "S106"]

[tool.ruff.format]
exclude = ["*.ipynb"]

[tool.coverage.run]
branch = true
source = ["rag_pipeline", "app", "run_rag"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
